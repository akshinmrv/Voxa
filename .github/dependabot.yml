version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    # One pull request for all of them: they move together (Node 24 came to seven at once),
    # and as separate ones they went stale side by side.
    groups:
      github-actions:
        patterns: ["*"]
