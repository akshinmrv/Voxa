name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The heavy runtime deps (torch, whisper, ffmpeg, the TTS engines) are deliberately
      # NOT installed: voxa guards those imports, so the pure-logic suite runs in seconds.
      # numpy/soundfile/openai are what the tests themselves import; the few tests that
      # need torch skip when it is absent. The [serve] trio is needed because the settings
      # tests import voxa_server and drive it through FastAPI's TestClient.
      - name: Install test dependencies
        run: pip install pytest numpy soundfile openai fastapi httpx python-multipart

      - name: Syntax check
        run: python -m py_compile voxa.py

      - name: Run tests
        run: pytest

  smoke:
    name: smoke (real ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # These run the real ffmpeg assembly the other jobs skip — the final mix in particular,
      # where the "closing line truncated" bug hid. ffmpeg only; no torch, models, or network.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install test dependencies
        run: pip install pytest numpy soundfile openai

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

  package:
    name: package (wheel with console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console ships inside the wheel as a static build, made exactly as the release
      # makes it, so a change that breaks the export fails here rather than at a tag.
      - name: Build the console
        working-directory: web
        run: |
          npm ci
          npm run build:console

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Check the wheel ships the console
        run: |
          python scripts/check_wheel_console.py dist/*.whl
          pip install --no-deps dist/*.whl
          cd /tmp && python -c "import voxa_ui; assert voxa_ui.static_dir(), 'console not found'"

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: docker (image + console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The image used to be built only at a release, so a Dockerfile that broke was found
      # after the tag. The layer cache is shared with the release workflow.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: voxa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image runs and serves the console
        run: |
          docker run --rm voxa:ci --version
          docker run --rm voxa:ci doctor
          docker run -d --name voxa -p 127.0.0.1:8000:8000 voxa:ci serve --host 0.0.0.0
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/en/app/ | grep -q "</html>"
          curl -fs http://127.0.0.1:8000/api/engines | grep -q '"chatterbox"'
          # Port-mapped requests aren't loopback; the refusal says what to do in a container.
          curl -s -X POST http://127.0.0.1:8000/api/engines/chatterbox/install \
            | grep -q "voxa engines install"
          docker exec voxa sh -c 'command -v uv && echo "$VOXA_ENGINES_DIR"'
          docker rm -f voxa

      - name: Show the server's log
        if: failure()
        run: docker logs voxa || true
