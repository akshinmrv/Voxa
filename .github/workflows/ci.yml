name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The heavy runtime deps (torch, whisper, ffmpeg, the TTS engines) are deliberately
      # NOT installed: voxa guards those imports, so the pure-logic suite runs in seconds.
      # numpy/soundfile/openai are what the tests themselves import; the few tests that
      # need torch skip when it is absent. The [serve] trio is needed because the settings
      # tests import voxa_server and drive it through FastAPI's TestClient.
      - name: Install test dependencies
        run: pip install pytest numpy soundfile openai fastapi httpx python-multipart

      - name: Syntax check
        run: python -m py_compile voxa.py

      - name: Run tests
        run: pytest

  smoke:
    name: smoke (real ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # These run the real ffmpeg assembly the other jobs skip — the final mix in particular,
      # where the "closing line truncated" bug hid. ffmpeg only; no torch, models, or network.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install test dependencies
        run: pip install pytest numpy soundfile openai

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

  package:
    name: package (wheel with console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console ships inside the wheel as a static build, made exactly as the release
      # makes it, so a change that breaks the export fails here rather than at a tag.
      - name: Build the console
        working-directory: web
        run: |
          npm ci
          npm run build:console

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Check the wheel ships the console
        run: |
          python scripts/check_wheel_console.py dist/*.whl
          pip install --no-deps dist/*.whl
          cd /tmp && python -c "import voxa_ui; assert voxa_ui.static_dir(), 'console not found'"

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The real one-line installer, with a wheel of this commit. A runner has no GPU, so it should
  # get the CPU build of PyTorch, not PyPI's CUDA one with 2.5 GB of NVIDIA libraries.
  installer:
    name: installer (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip wheel --no-deps -w dist .
      - name: Run install.sh
        env:
          VOXA_NO_SHORTCUT: "1"
          VOXA_NO_FFMPEG: "1"
          VOXA_NO_MODIFY_PATH: "1"
        run: VOXA_WHEEL="$(ls dist/*.whl)" sh web/public/install.sh
      - name: Check it got the CPU build of PyTorch
        run: |
          uv="$(command -v uv || echo "$HOME/.local/bin/uv")"
          env="$("$uv" tool dir)/voxa-dub"
          "$env/bin/python" -c "import torch; print('torch', torch.__version__); assert torch.__version__.endswith('+cpu')"
          if "$uv" pip list --python "$env/bin/python" | grep -iE '^(nvidia|triton)'; then exit 1; fi
          du -sh "$env"
          "$("$uv" tool dir --bin)/voxa" --version
      # Triton is left out beside the CPU build; word timestamps take Whisper through the code
      # that would use it on a GPU.
      - name: Check Whisper runs without Triton
        run: |
          uv="$(command -v uv || echo "$HOME/.local/bin/uv")"
          "$("$uv" tool dir)/voxa-dub/bin/python" -c "
          import soundfile, whisper
          from scipy.signal import resample_poly
          audio, rate = soundfile.read('web/public/tts-samples/onyx.mp3', dtype='float32', always_2d=True)
          audio = resample_poly(audio.mean(axis=1), 16000, rate).astype('float32')
          result = whisper.load_model('tiny').transcribe(audio, word_timestamps=True, fp16=False)
          words = [w for s in result['segments'] for w in s.get('words', [])]
          assert words, result
          print(len(words), 'words, timed on the CPU without triton:', result['text'])
          "

  docker:
    name: docker (image + console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # The image used to be built only at a release, so a Dockerfile that broke was found
      # after the tag. The layer cache is shared with the release workflow.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: voxa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image runs and serves the console
        run: |
          docker run --rm voxa:ci --version
          docker run --rm voxa:ci doctor
          docker run -d --name voxa -p 127.0.0.1:8000:8000 voxa:ci serve --host 0.0.0.0
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
          # Listening beyond loopback, it made up an access token and printed the link with it.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/engines)" = 401
          link=$(docker logs voxa 2>&1 | grep -o 'http://127.0.0.1:8000/?token=[^ ]*' | head -n 1)
          test -n "$link"
          curl -fs -c jar -o /dev/null "$link"
          curl -fs -b jar http://127.0.0.1:8000/en/app/ | grep -q "</html>"
          curl -fs -b jar http://127.0.0.1:8000/api/engines | grep -q '"chatterbox"'
          # A port-mapped request is never loopback; the token is what lets the console's
          # Settings and Models pages work in a container.
          curl -fs -b jar -X PUT -H 'Content-Type: application/json' -d '{"defaultTts":"edge"}' \
            http://127.0.0.1:8000/api/settings > /dev/null
          docker logs voxa 2>&1 | grep -q 'token=\[hidden\]'      # not in the access log
          docker exec voxa sh -c 'command -v uv && echo "$VOXA_ENGINES_DIR"'
          docker rm -f voxa

      - name: Show the server's log
        if: failure()
        run: docker logs voxa || true
