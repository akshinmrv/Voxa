name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag on the wrong commit publishes the wrong version: 1.11.0's first tag put out a
  # GitHub release and an image before PyPI refused the wheel. Every other job waits on this.
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Match the tag to the version
        run: python3 scripts/check_release_tag.py "$GITHUB_REF_NAME"

  # A tag that can't pass its own tests should not become a release — on every Python we
  # support, as CI does. Testing 3.12 alone let a 3.9-only bug reach PyPI in 1.9.0.
  verify:
    name: Verify (py${{ matrix.python-version }})
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest ruff numpy soundfile openai fastapi httpx python-multipart

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Voxa $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the full list of changes." \
            --generate-notes

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity, so no API token
      # is stored in the repository. Configure the publisher once at
      # https://pypi.org/manage/project/voxa-dub/settings/publishing/
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `voxa serve` serves the console from the wheel, so it is built first (see voxa_ui/).
      - name: Build the console
        working-directory: web
        run: |
          npm ci
          npm run build:console

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel ships the console
        run: python scripts/check_wheel_console.py dist/*.whl

      - name: Check the metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Publish the container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase image name; the repository is akshinmrv/Voxa.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/akshinmrv/voxa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # VoxaSetup.exe for this release, which installs it from PyPI: so it waits for PyPI, installs
  # it on a clean Windows runner and uninstalls it before it is attached to the release. The
  # unversioned copy is what releases/latest/download/VoxaSetup.exe points at.
  windows-installer:
    name: Publish the Windows installer
    needs: pypi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Get NSIS
        shell: pwsh
        run: installer/windows/get_nsis.ps1
      - name: Build VoxaSetup.exe
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          python scripts/build_windows_installer.py $version --out dist
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Install it from PyPI, check and uninstall it
        shell: pwsh
        run: |
          # A release PyPI has just published takes a while to be served everywhere. uv reads
          # the simple index, which PyPI's CDN can serve without it for a while after the JSON
          # API lists it (1.17.0's Setup failed so), and not from every node at once: wait
          # until it's there, then try the install again if a node still answers without it.
          $index = @{ Accept = "application/vnd.pypi.simple.v1+json" }
          foreach ($i in 1..40) {
            try {
              $simple = Invoke-RestMethod -Headers $index "https://pypi.org/simple/voxa-dub/"
              if ($simple.versions -contains $env:VERSION) { break }
            } catch {}
            Start-Sleep -Seconds 15
          }
          foreach ($try in 1..3) {
            try {
              installer/windows/test_install.ps1 -Installer "dist\VoxaSetup-$env:VERSION.exe" -Version $env:VERSION
              break
            } catch {
              if ($try -eq 3) { throw }
              Write-Host "::warning::Setup failed ($_); trying again in a minute"
              Start-Sleep -Seconds 60
            }
          }
      - name: Attach it to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "dist\VoxaSetup-$env:VERSION.exe" dist\VoxaSetup.exe
          gh release upload $env:GITHUB_REF_NAME "dist\VoxaSetup-$env:VERSION.exe" dist\VoxaSetup.exe --clobber
